```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter–Picture Match | BrightNest</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f6ff;
  color: #24304a;
}

header {
  background: linear-gradient(135deg, #174a7e, #4285d4);
  color: white;
  padding: 22px 5%;
}

header a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 25px 16px;
}

.panel {
  background: white;
  padding: 25px;
  margin-bottom: 20px;
  border-radius: 20px;
  box-shadow: 0 5px 18px #24304a12;
  text-align: center;
}

.instructions {
  color: #64748b;
  line-height: 1.6;
}

.progress {
  color: #245da8;
  font-weight: bold;
}

.picture {
  font-size: 100px;
  margin: 20px 0 10px;
}

.word {
  font-size: 30px;
  font-weight: bold;
  color: #174a7e;
  margin: 12px;
}

.question {
  font-size: 21px;
  font-weight: bold;
  margin: 24px 0;
}

.choices {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  max-width: 450px;
  margin: auto;
}

.choice {
  background: #e7f0ff;
  color: #174a7e;
  border: 3px solid transparent;
  border-radius: 16px;
  padding: 18px 10px;
  font-size: 32px;
  font-weight: bold;
  cursor: pointer;
}

.choice:hover:not(:disabled) {
  background: #d2e4ff;
}

.choice:disabled {
  cursor: default;
  opacity: 0.85;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px 20px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  background: #245da8;
  color: white;
  margin: 8px;
}

.primary:hover {
  background: #174578;
}

.feedback {
  min-height: 30px;
  margin: 20px 0;
  font-weight: bold;
  line-height: 1.5;
}

.score {
  font-weight: bold;
  color: #245da8;
}

.hidden { display: none !important; }

@media (max-width: 480px) {
  .panel { padding: 20px 12px; }
  .picture { font-size: 78px; }
  .choice { font-size: 27px; padding: 15px 5px; }
  .question { font-size: 19px; }
}
</style>
</head>

<body>

<header>
  <a href="sounds-letters.html">← Back to Sounds & Letters</a>
  <h1>🖼️ Letter–Picture Match</h1>
  <p>Look at the picture, listen to the word and find its first letter!</p>
</header>

<main>
  <section class="panel" id="gamePanel">
    <p class="progress" id="progress">Question 1 of 100</p>
    <p class="score" id="score">Score: 0 / 0</p>

    <div class="picture" id="picture">🍎</div>
    <div class="word" id="word">APPLE</div>

    <button class="primary" onclick="speakWord()">
      🔊 Listen to the Word
    </button>

    <div class="question">Which letter does this word begin with?</div>

    <div class="choices" id="choices"></div>

    <div class="feedback" id="feedback" aria-live="polite"></div>

    <button class="primary hidden" id="nextButton" onclick="nextQuestion()">
      Next Question →
    </button>
  </section>
</main>

<script>
const wordBank = [
  ["APPLE","🍎","A"], ["BALL","⚽","B"],
  ["CAT","🐱","C"], ["DOG","🐶","D"],
  ["ELEPHANT","🐘","E"], ["FISH","🐟","F"],
  ["GOAT","🐐","G"], ["HAT","🎩","H"],
  ["INK","🖋️","I"], ["JUG","🏺","J"],
  ["KITE","🪁","K"], ["LION","🦁","L"],
  ["MANGO","🥭","M"], ["NEST","🪺","N"],
  ["ORANGE","🍊","O"], ["PARROT","🦜","P"],
  ["QUEEN","👑","Q"], ["RABBIT","🐇","R"],
  ["SUN","☀️","S"], ["TIGER","🐯","T"],
  ["UMBRELLA","☂️","U"], ["VAN","🚐","V"],
  ["WATCH","⌚","W"], ["BOX","📦","B"],
  ["X-RAY","🩻","X"], ["YOYO","🪀","Y"],
  ["ZEBRA","🦓","Z"], ["ANT","🐜","A"],
  ["BIRD","🐦","B"], ["CUP","🥤","C"],
  ["DRUM","🥁","D"], ["EGG","🥚","E"],
  ["FAN","🪭","F"], ["GIRL","👧","G"],
  ["HOUSE","🏠","H"], ["IGLOO","🧊","I"],
  ["JAM","🍓","J"], ["KEY","🔑","K"],
  ["LEAF","🍃","L"], ["MOON","🌙","M"],
  ["NOSE","👃","N"], ["OWL","🦉","O"],
  ["PEN","🖊️","P"], ["QUILT","🛏️","Q"],
  ["ROSE","🌹","R"], ["SHIP","🚢","S"],
  ["TOMATO","🍅","T"], ["UNCLE","👨","U"],
  ["VIOLIN","🎻","V"], ["WHALE","🐋","W"],
  ["XYLOPHONE","🎼","X"], ["YAK","🐂","Y"],
  ["ZIPPER","🤐","Z"], ["AXE","🪓","A"],
  ["BOOK","📚","B"], ["CAR","🚗","C"],
  ["DUCK","🦆","D"], ["EAR","👂","E"],
  ["FROG","🐸","F"], ["GIFT","🎁","G"],
  ["HAND","✋","H"], ["ICE","🧊","I"],
  ["JEEP","🚙","J"], ["KANGAROO","🦘","K"],
  ["LAMP","💡","L"], ["MILK","🥛","M"],
  ["NUT","🥜","N"], ["OIL","🛢️","O"],
  ["PANDA","🐼","P"], ["QUAIL","🐦","Q"],
  ["ROAD","🛣️","R"], ["STAR","⭐","S"],
  ["TRAIN","🚆","T"], ["UNIFORM","👔","U"],
  ["VASE","🏺","V"], ["WATER","💧","W"],
  ["XENOPS","🐦","X"], ["YELLOW","🟡","Y"],
  ["ZOO","🦒","Z"], ["ARROW","🏹","A"],
  ["BELL","🔔","B"], ["COW","🐄","C"],
  ["DESK","🪑","D"], ["ELF","🧝","E"],
  ["FEET","🦶","F"], ["GLASS","🥛","G"],
  ["HEN","🐔","H"], ["INSECT","🐞","I"],
  ["JACKET","🧥","J"], ["KETTLE","🫖","K"],
  ["LADDER","🪜","L"], ["MONKEY","🐒","M"],
  ["NEEDLE","🪡","N"], ["OCEAN","🌊","O"],
  ["PIZZA","🍕","P"], ["QUARTER","🪙","Q"],
  ["RING","💍","R"], ["SOCK","🧦","S"],
  ["TURTLE","🐢","T"], ["VEST","🦺","V"]
];

let questions = [];
let current = 0;
let score = 0;
let answered = 0;
const TOTAL_QUESTIONS = 100;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function startGame() {
  questions = shuffle([...wordBank])
    .slice(0, TOTAL_QUESTIONS)
    .map(item => ({
      word: item[0],
      picture: item[1],
      answer: item[2]
    }));

  current = 0;
  score = 0;
  answered = 0;

  document.getElementById("gamePanel").innerHTML = `
    <p class="progress" id="progress"></p>
    <p class="score" id="score"></p>
    <div class="picture" id="picture"></div>
    
    <button class="primary" onclick="speakWord()">🔊 Listen to the Word</button>
    <div class="question">Which letter does this word begin with?</div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <button class="primary hidden" id="nextButton" onclick="nextQuestion()">Next Question →</button>
  `;

  showQuestion();
}

function showQuestion() {
  const q = questions[current];

  document.getElementById("progress").textContent =
    `Question ${current + 1} of ${questions.length}`;

  document.getElementById("score").textContent =
    `Score: ${score} / ${answered}`;

  document.getElementById("picture").textContent = q.picture;

  document.getElementById("feedback").textContent = "";
  document.getElementById("nextButton").classList.add("hidden");

  const wrongLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
    .split("")
    .filter(letter => letter !== q.answer);

  shuffle(wrongLetters);

  const choices = shuffle([q.answer, ...wrongLetters.slice(0, 2)]);
  const container = document.getElementById("choices");
  container.innerHTML = "";

  choices.forEach(letter => {
    const button = document.createElement("button");
    button.className = "choice";
    button.textContent = letter;
    button.setAttribute("aria-label", `Letter ${letter}`);
    button.onclick = () => checkAnswer(letter);
    container.appendChild(button);
  });
}

function checkAnswer(letter) {
  const q = questions[current];

  document.querySelectorAll(".choice").forEach(button => {
    button.disabled = true;
  });

  answered++;

  if (letter === q.answer) {
    score++;
    document.getElementById("feedback").textContent =
      "🎉 Correct! " + q.word + " begins with " + q.answer + "!";
  } else {
    document.getElementById("feedback").textContent =
      "Good try! " + q.word + " begins with " + q.answer + ".";
  }

  document.getElementById("score").textContent =
    `Score: ${score} / ${answered}`;

  const nextButton = document.getElementById("nextButton");
  nextButton.classList.remove("hidden");
  nextButton.textContent =
    current === questions.length - 1 ? "See Results →" : "Next Question →";
}

function nextQuestion() {
  if (current < questions.length - 1) {
    current++;
    showQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  const percentage = Math.round(score / questions.length * 100);

  let message = "Keep practising. You will improve!";
  if (percentage >= 90) message = "🌟 Excellent letter detective!";
  else if (percentage >= 70) message = "👏 Very good work!";
  else if (percentage >= 50) message = "👍 Good effort. Keep learning!";

  document.getElementById("gamePanel").innerHTML = `
    <div class="picture">🏆</div>
    <h2>Letter–Picture Match Results</h2>
    <p>You completed ${questions.length} questions.</p>
    <p class="score">Correct: ${score} / ${questions.length}</p>
    <p class="score">Accuracy: ${percentage}%</p>
    <p>${message}</p>
    <button class="primary" onclick="startGame()">Play Again ↻</button>
    <p><a href="sounds-letters.html">← Return to Sounds & Letters</a></p>
  `;
}

function speakWord() {
  if (!("speechSynthesis" in window)) {
    alert("Audio is not supported in this browser.");
    return;
  }

  window.speechSynthesis.cancel();

  const q = questions[current];
  const speech = new SpeechSynthesisUtterance(
    q.word.toLowerCase()
  );

  speech.lang = "en-IN";
  speech.rate = 0.8;

  window.speechSynthesis.speak(speech);
}

startGame();
</script>

</body>
</html>
```
